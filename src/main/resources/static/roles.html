<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaitWise - Select Your Role</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles-v2.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">

    <!-- Back Button -->
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

    <div class="glass-container" style="max-width: 800px; padding: 4rem;">
        <h2 class="title" style="margin-bottom: 0.5rem;">Who are you today?</h2>
        <p class="subtitle">Please select your role to access the appropriate portal.</p>

        <div class="role-grid" style="margin-top: 2rem;">
            <div class="role-card" onclick="window.location.href='citizen-register.html'">
                <i class="fas fa-user"></i>
                <h3>Citizen</h3>
                <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.5rem;">Generate tokens & check status</p>
            </div>
            <div class="role-card" onclick="window.location.href='staff-login.html'">
                <i class="fas fa-users-cog"></i>
                <h3>Staff</h3>
                <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.5rem;">Admin, Reception & Counter access</p>
            </div>
        </div>
    </div>

</body>
</html>
