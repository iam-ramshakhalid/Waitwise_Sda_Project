<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaitWise - Citizen Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles-v2.css">
</head>
<body>

    <!-- Back Button -->
    <a href="roles.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

    <div id="globalLoader" class="loader-container hidden">
        <div class="spinner"></div>
    </div>

    <div class="glass-container" style="margin-top: 5rem;">
        <h2 class="title">Citizen Login</h2>
        <p class="subtitle">Welcome back! Please login to manage your tokens.</p>

        <div id="loginError" class="alert alert-error hidden"></div>

        <form onsubmit="loginCitizen(event)">
            <div class="form-group">
                <label class="form-label" for="cnic">CNIC / Username</label>
                <input type="text" id="cnic" class="form-control" placeholder="Enter your CNIC" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p style="color: var(--text-secondary); font-size: 0.875rem;">Don't have an account? <a href="citizen-register.html" class="link">Create one</a></p>
        </div>
    </div>

    <script src="js/app.js?v=3.0"></script>
</body>
</html>
