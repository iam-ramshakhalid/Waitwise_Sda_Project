<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaitWise - Staff Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles-v2.css">
</head>
<body>

    <!-- Back Button -->
    <a href="roles.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

    <div id="globalLoader" class="loader-container hidden">
        <div class="spinner"></div>
    </div>

    <div class="glass-container" style="margin-top: 5rem;">
        <h2 class="title" style="color: var(--accent-blue);">Staff Login</h2>
        <p class="subtitle">Secure portal for Admin, Counter, and Reception staff.</p>

        <div id="loginError" class="alert alert-error hidden"></div>

        <form onsubmit="loginStaff(event)">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="e.g. reception or counter1" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary" style="background: linear-gradient(135deg, #3B82F6, #2563EB); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);">Access Portal</button>
            </div>
        </form>
    </div>

    <script src="js/app.js?v=3.0"></script>
    <script>
        async function loginStaff(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const loader = document.getElementById('globalLoader');

            errorDiv.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                const response = await fetch(`http://localhost:8081/api/auth/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('staffUser', JSON.stringify(data));
                    
                    // Redirect based on role
                    if (data.role === 'Admin') {
                        window.location.href = 'admin-portal.html';
                    } else if (data.role.startsWith('CounterStaff')) {
                        // Extract service ID from role (e.g., CounterStaff1 -> 1)
                        const serviceId = data.role.replace('CounterStaff', '');
                        localStorage.setItem('assignedServiceId', serviceId);
                        window.location.href = 'counter-dashboard.html';
                    } else if (data.role === 'ReceptionStaff') {
                        window.location.href = 'reception-dashboard.html';
                    } else {
                        errorDiv.textContent = 'Unauthorized access. Only staff allowed.';
                        errorDiv.classList.remove('hidden');
                    }
                } else {
                    const errorText = await response.text();
                    errorDiv.textContent = errorText || 'Invalid credentials';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorDiv.textContent = 'Network error. Make sure backend is running.';
                errorDiv.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
